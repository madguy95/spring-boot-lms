# ========================================
# DEV - ENVIRONMENT CONFIGURATION
# ========================================

# Spring Datasource Configuration
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/redis_jwt?serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false  # JDBC URL for local MySQL database
    username: ${DB_USERNAME:root}  # Database username (default: root)
    password: ${DB_PASSWORD:123456}  # Database password (default: 123456)
    hikari:
      minimum-idle: 2  # Minimum number of idle connections in the pool
      maximum-pool-size: 10  # Maximum number of connections in the pool

  # Flyway Configuration (Dev-specific overrides)
  flyway:
    baseline-on-migrate: true  # Allow baseline on existing database (dev only)
    baseline-version: 0  # Baseline version for migrations

  jpa:
    show-sql: true  # Show SQL statements in logs (useful for debugging)
    hibernate:
      ddl-auto: validate  # Flyway manages schema, JPA only validates
    defer-datasource-initialization: false  # Flyway runs before JPA

  sql:
    init:
      mode: never  # Disable SQL init scripts, use Flyway instead

# Server Configuration
server:
  port: ${SERVER_PORT:8080}  # Server port (default: 8080)
  error:
    include-message: always  # Always include error messages in responses
    include-binding-errors: always  # Always include binding errors
    include-stacktrace: on-param  # Include stacktrace if requested
    include-exception: true  # Include exception details

# Application Settings
app:
  jwt-expiration-ms: 86400000  # JWT expiration time in milliseconds (24 hours)
  jwt-refresh-expiration-ms: 604800000  # JWT refresh token expiration (7 days)

  # CORS
  cors:
    allowed-origins:
      - http://localhost:3000  # Allowed origin for local frontend
      - http://localhost:4200  # Allowed origin for Angular frontend
      - http://localhost:8080  # Allowed origin for local backend
    allowed-methods: "*"  # Allow all HTTP methods
    allowed-headers: "*"  # Allow all headers
    exposed-headers: "*"  # Expose all headers
    allow-credentials: true  # Allow credentials in CORS
    max-age: 3600  # Max age for CORS preflight requests

# Actuator (show all in dev)
management:
  endpoints:
    web:
      exposure:
        include: "*"  # Expose all actuator endpoints in dev
  endpoint:
    health:
      show-details: always  # Always show health details

# File Upload
file:
  upload:
    dir: uploads-dev  # Directory for file uploads
    max-size: 10485760  # Maximum upload file size (10MB)

# Debug
debug: false  # Disable debug mode
trace: false  # Disable trace mode
