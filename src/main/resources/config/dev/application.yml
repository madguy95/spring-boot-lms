# ========================================
# DEV - ENVIRONMENT CONFIGURATION
# ========================================

# Spring Datasource Configuration
spring:
  datasource:
    # Local dev defaults (safe to commit). Override via env vars (.env / shell) to point at a remote DB.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver  # Explicit PostgreSQL JDBC driver
    hikari:
      minimum-idle: 2  # Minimum number of idle connections in the pool
      maximum-pool-size: 10  # Maximum number of connections in the pool

  # Flyway Configuration (Dev-specific overrides)
  flyway:
    enabled: true  # Flyway is the schema source of truth for PostgreSQL in dev
    baseline-on-migrate: true  # Allow baseline on existing database (dev only)
    baseline-version: 0  # Baseline version for migrations

  jpa:
    show-sql: true  # Show SQL statements in logs (useful for debugging)
    hibernate:
      ddl-auto: validate  # Flyway manages schema, JPA only validates
    defer-datasource-initialization: false  # Flyway runs before JPA

  sql:
    init:
      mode: never  # Disable SQL init scripts, use Flyway instead

  cache:
    type: simple  # Temporary: disable Redis-backed cache in dev

  quartz:
    auto-startup: false  # Temporary: do not start Quartz scheduler in dev

  # Multipart limits (must be >= the biggest asset we accept = intro video 200MB)
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB

kafka:
  health:
    enabled: false  # Temporary: disable Kafka health indicator/admin checks

# Server Configuration
server:
  port: ${SERVER_PORT:8080}  # Server port (default: 8080)
  error:
    include-message: always  # Always include error messages in responses
    include-binding-errors: always  # Always include binding errors
    include-stacktrace: on-param  # Include stacktrace if requested
    include-exception: true  # Include exception details

# Application Settings
app:
  jwt-expiration-ms: 86400000  # JWT expiration time in milliseconds (24 hours)
  jwt-refresh-expiration-ms: 604800000  # JWT refresh token expiration (7 days)

  redis:
    enabled: false  # Temporary: disable Redis feature in dev
  kafka:
    enabled: false  # Temporary: disable Kafka feature in dev
  quartz:
    enabled: false  # Temporary: disable Quartz feature in dev

  # CORS
  cors:
    allowed-origins:
      - http://localhost:3000  # Allowed origin for local frontend
      - http://localhost:4200  # Allowed origin for Angular frontend
      - http://localhost:8080  # Allowed origin for local backend
    allowed-methods: "*"  # Allow all HTTP methods
    allowed-headers: "*"  # Allow all headers
    exposed-headers: "*"  # Expose all headers
    allow-credentials: true  # Allow credentials in CORS
    max-age: 3600  # Max age for CORS preflight requests

  # DEV-ONLY workaround for corporate SSL-inspection proxies (Zscaler, Netskope, ...).
  # When true, JVM accepts ANY TLS certificate — bypasses PKIX path failures without needing
  # to import the proxy root CA into cacerts. NEVER enable outside local dev.
  ssl:
    trust-all: ${TRUST_ALL_SSL:true}
# Actuator (show all in dev)
management:
  endpoints:
    web:
      exposure:
        include: "*"  # Expose all actuator endpoints in dev
  endpoint:
    health:
      show-details: always  # Always show health details

# File Upload
file:
  storage:
    type: ${FILE_STORAGE_TYPE:cloudinary}  # local | cloudinary
  upload:
    dir: uploads-dev  # Directory for file uploads (used when storage type = local)
    max-size: 10485760  # Maximum upload file size (10MB) for generic /upload endpoint
  cloudinary:
    # Cloudinary credentials MUST come from env vars (.env locally, Render env vars in prod).
    # Empty defaults force misconfiguration to fail fast instead of silently uploading nowhere.
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    default-folder: ${CLOUDINARY_DEFAULT_FOLDER:lms-dev}
    secure: true

# Debug
debug: false  # Disable debug mode
trace: false  # Disable trace mode
