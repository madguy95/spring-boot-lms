# ========================================
# COMMON REDIS CONFIGURATION
# ========================================
# Shared Redis settings across all environments

spring:
  # Redis Configuration
  data:
    redis:
      timeout: ${REDIS_TIMEOUT:60000ms}  # Redis connection timeout (can be overridden by REDIS_TIMEOUT env variable)

      # Connection Pool Settings (Lettuce)
      lettuce:
        pool:
          enabled: true  # Enable connection pooling for Lettuce client
          max-wait: ${REDIS_POOL_MAX_WAIT:3000ms}  # Maximum wait time for a connection (can be overridden by REDIS_POOL_MAX_WAIT env variable)
        shutdown-timeout: ${REDIS_SHUTDOWN_TIMEOUT:100ms}  # Timeout for shutting down Lettuce client (can be overridden by REDIS_SHUTDOWN_TIMEOUT env variable)

  # Cache Configuration — type and per-env settings in env-specific redis.yml
  cache:
    redis:
      cache-null-values: false
      use-key-prefix: true
