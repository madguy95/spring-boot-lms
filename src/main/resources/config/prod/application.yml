# ========================================
# PROD - ENVIRONMENT CONFIGURATION
# ========================================

# Spring Datasource Configuration
spring:
  datasource:
    url: ${DB_URL}  # JDBC URL for production database (set via DB_URL env variable)
    username: ${DB_USERNAME}  # Database username (set via DB_USERNAME env variable)
    password: ${DB_PASSWORD}  # Database password (set via DB_PASSWORD env variable)
    hikari:
      minimum-idle: 10  # Minimum number of idle connections in the pool
      maximum-pool-size: 50  # Maximum number of connections in the pool
      leak-detection-threshold: 60000  # Time (ms) to detect connection leaks
      connection-test-query: SELECT 1  # Query to test connection validity

  # Flyway Configuration (Production-specific overrides)
  flyway:
    baseline-on-migrate: false  # Do not allow baseline in production
    validate-on-migrate: true  # Strict validation before migration

  jpa:
    show-sql: false  # Do not show SQL statements in logs (production)
    hibernate:
      ddl-auto: validate  # Only validate schema, do not auto-create/update
    defer-datasource-initialization: false  # Flyway runs before JPA

  sql:
    init:
      mode: never  # Do not use SQL init scripts (production)

  # Ensure JDBC jobstore is explicitly set for Quartz clustering
  quartz:
    job-store-type: jdbc

  # Graceful Shutdown
  lifecycle:
    timeout-per-shutdown-phase: 30s  # Timeout for each shutdown phase

  # Multipart limits — must be >= the biggest asset type (COURSE_INTRO_VIDEO = 200MB).
  # Root application.yml already defaults to 200MB; restated here so prod stays explicit.
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:200MB}
      max-request-size: ${MAX_REQUEST_SIZE:220MB}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}  # Server port (default: 8080)
  compression:
    enabled: true  # Enable response compression
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json  # MIME types to compress
    min-response-size: 1024  # Minimum response size (bytes) to compress
  error:
    include-message: never  # Do not include error messages in responses
    include-binding-errors: never  # Do not include binding errors
    include-stacktrace: never  # Do not include stacktrace
    include-exception: false  # Do not include exception details
  shutdown: graceful  # Enable graceful shutdown
  servlet:
    session:
      timeout: 30m  # Session timeout duration
      cookie:
        http-only: true  # Set session cookie as HTTP only
        secure: true  # Set session cookie as secure
        same-site: strict  # Set session cookie SameSite policy to strict

# Application Settings
app:
  jwt-secret: ${JWT_SECRET}  # Secret key for JWT signing
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}  # JWT expiration time in milliseconds (default: 1 hour)
  jwt-refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}  # JWT refresh token expiration (default: 30 days)

  # SSL — NEVER allow trust-all in prod; enforces JVM cert validation even if someone
  # accidentally sets TRUST_ALL_SSL=true at the env var level.
  ssl:
    trust-all: ${TRUST_ALL_SSL:true}

  # CORS (Strict)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}  # Allowed origins for CORS (override via env var)
    allowed-methods: GET,POST,PUT,DELETE,PATCH  # Allowed HTTP methods
    allowed-headers: Origin,Content-Type,Accept,Authorization  # Allowed headers
    exposed-headers: Authorization  # Exposed headers
    allow-credentials: true  # Allow credentials in CORS
    max-age: 3600  # Max age for CORS preflight requests

# Actuator (Limited)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # Expose only selected actuator endpoints
  endpoint:
    health:
      show-details: when-authorized  # Show health details only when authorized

# File Upload
file:
  # Render's container filesystem is ephemeral — local storage is NOT acceptable in prod.
  # Force Cloudinary unless explicitly overridden via env (e.g. for a self-hosted setup).
  storage:
    type: ${FILE_STORAGE_TYPE:cloudinary}
  upload:
    dir: ${FILE_UPLOAD_DIR:/app/uploads}  # Used only when storage type = local
    max-size: ${FILE_MAX_SIZE:5242880}  # Generic /upload endpoint cap (5MB); per-asset caps live in UploadAssetType
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}      # Required — fail-fast if missing
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    default-folder: ${CLOUDINARY_DEFAULT_FOLDER:lms-prod}
    secure: true

# Debug OFF
debug: false  # Disable debug mode
trace: false  # Disable trace mode
