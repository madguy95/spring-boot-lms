# ========================================
# STAGING - ENVIRONMENT CONFIGURATION
# ========================================

# Spring Datasource Configuration
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://staging-db:3306/redis_jwt_staging?serverTimezone=UTC&useSSL=true}  # JDBC URL for staging database
    username: ${DB_USERNAME}  # Database username for staging
    password: ${DB_PASSWORD}  # Database password for staging
    hikari:
      minimum-idle: 5  # Minimum number of idle connections in the pool
      maximum-pool-size: 30  # Maximum number of connections in the pool
      connection-test-query: SELECT 1  # Query to test connection validity

  # ===== Flyway Configuration (Staging-specific overrides) =====
  flyway:
    # KHÔNG cho phép baseline trong staging (DB phải clean hoặc đã có flyway_schema_history)
    baseline-on-migrate: false  # Do not allow baseline in staging (DB must be clean or have flyway_schema_history)

  jpa:
    show-sql: true  # Show SQL statements in logs (staging)
    hibernate:
      ddl-auto: validate  # Flyway manages schema, JPA only validates
    defer-datasource-initialization: false  # Flyway runs before JPA

  sql:
    init:
      mode: never  # Disable SQL init scripts, use Flyway instead

# Server Configuration
server:
  port: ${SERVER_PORT:8080}  # Server port (default: 8080)
  compression:
    enabled: true  # Enable response compression
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json  # MIME types to compress
    min-response-size: 1024  # Minimum response size (bytes) to compress
  error:
    include-message: on-param  # Include error messages if requested
    include-binding-errors: on-param  # Include binding errors if requested
    include-stacktrace: on-param  # Include stacktrace if requested
    include-exception: false  # Do not include exception details
  shutdown: graceful  # Enable graceful shutdown

# Application Settings
app:
  jwt-secret: ${JWT_SECRET:staging-secret-replace-in-production}  # Secret key for JWT signing (staging)
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:7200000}  # JWT expiration time in milliseconds (2 hours)
  jwt-refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # JWT refresh token expiration (7 days)

  # CORS
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:https://staging.yourdomain.com}  # Allowed origin for staging
      - https://test.yourdomain.com  # Additional allowed origin
    allowed-methods: GET,POST,PUT,DELETE,PATCH  # Allowed HTTP methods
    allowed-headers: Authorization,Content-Type,Accept,X-Request-ID  # Allowed headers
    exposed-headers: Authorization  # Exposed headers
    allow-credentials: true  # Allow credentials in CORS
    max-age: 3600  # Max age for CORS preflight requests

# Actuator (Limited)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # Expose selected actuator endpoints
  endpoint:
    health:
      show-details: when-authorized  # Show health details only when authorized

# File Upload
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:/app/uploads-staging}  # Directory for file uploads in staging
    max-size: ${FILE_MAX_SIZE:10485760}  # Maximum upload file size (10MB)

# Debug
debug: false  # Disable debug mode
trace: false  # Disable trace mode
